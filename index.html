                let sorted = Object.keys(finalScores).map(Number).sort((a,b) => finalScores[b] - finalScores[a]);
                selectedKills = pickKillWithCooldown(sorted, targetCount, recentHistory);
            } else if (strategy === 'combo') {
                for(let i=1; i<=49; i++) finalScores[i] = (normMiss[i] * 0.6) + (normFreq[i] * 0.4) + jitter;
                let sorted = Object.keys(finalScores).map(Number).sort((a,b) => finalScores[b] - finalScores[a]);
                selectedKills = pickKillWithCooldown(sorted, targetCount, recentHistory);
            } else if (strategy === 'intersect') {
                for(let i=1; i<=49; i++) {
                    let trend = (normMiss[i] * 0.7) - (normFreq[i] * 0.3); 
                    finalScores[i] = (normMiss[i] * 0.5) + (normFreq[i] * 0.3) + (trend * 0.2) + jitter;
                }
                
                let s_miss = {}, s_freq = {}, s_trend = {};
                for(let i=1; i<=49; i++) {
                    s_miss[i] = normMiss[i];
                    s_freq[i] = normFreq[i];
                    s_trend[i] = finalScores[i];
                }

                let poolSize = targetCount * 4;
                let p_miss = sortDesc(s_miss).slice(0, poolSize);
                let p_freq = sortDesc(s_freq).slice(0, poolSize);
                let p_trend = sortDesc(s_trend).slice(0, poolSize);

                for(let i=0; i<poolSize; i++) {
                    if(selectedKills.length >= targetCount) break;
                    let num = parseInt(p_miss[i]);
                    if(p_freq.includes(String(num)) && p_trend.includes(String(num)) && !recentHistory.includes(num)) {
                        selectedKills.push(num);
                    }
                }
                if(selectedKills.length < targetCount) {
                    for(let i=0; i<poolSize; i++) {
                        if(selectedKills.length >= targetCount) break;
                        let num = parseInt(p_miss[i]);
                        if(selectedKills.includes(num) || recentHistory.includes(num)) continue;
                        let matchCount = 0;
                        if(p_freq.includes(String(num))) matchCount++;
                        if(p_trend.includes(String(num))) matchCount++;
                        if(matchCount >= 1) selectedKills.push(num);
                    }
                }
                let sortedTrend = sortDesc(s_trend);
                for(let i=0; i<sortedTrend.length; i++) {
                    if(selectedKills.length >= targetCount) break;
                    let num = parseInt(sortedTrend[i]);
                    if(!selectedKills.includes(num) && !recentHistory.includes(num)) selectedKills.push(num);
                }
            }

            let zScores = {}; zodiacKeys.forEach(z => zScores[z] = 0);
            let tScores = {}; for(let t=0; t<10; t++) tScores[t] = 0;
            let headScores = {}; for(let h=0; h<5; h++) headScores[h] = 0;
            let halfScores = {"红单":0,"红双":0,"蓝单":0,"蓝双":0,"绿单":0,"绿双":0};
            
            // 新增属性分数池
            let sumScores = {}; for(let k in sumMap) sumScores[k] = 0;
            let doorScores = {}; for(let k in doorMap) doorScores[k] = 0;
            let segScores = {}; for(let k in segMap) segScores[k] = 0;
            let wuXingScores = {}; for(let k in wuXingMap) wuXingScores[k] = 0;
            let tailSumScores = {}; for(let t=0; t<10; t++) tailSumScores[t+"合尾"] = 0;
            let headParityScores = {}; 
            for(let h=0; h<5; h++) { headParityScores[h+"头单"] = 0; headParityScores[h+"头双"] = 0; }

            for(let i=1; i<=49; i++) {
                let score = finalScores[i] || 0;
                zScores[getZodiac(i)] += score;
                tScores[i%10] += score;
                headScores[Math.floor(i/10)] += score;
                halfScores[getHalfWave(i)] += score;
                
                sumScores[getSumGroupReal(i)] += score;
                doorScores[getDoorGroup(i)] += score;
                segScores[getSegGroup(i)] += score;
                wuXingScores[getWuXing(i)] += score;
                tailSumScores[getTailSum(i)] += score;
                headParityScores[getHeadParity(i)] += score;
            }

            return {
                sortedZ: sortDesc(zScores),
                sortedT: sortDesc(tScores).map(Number),
                sortedHead: sortDesc(headScores).map(Number),
                sortedHalf: sortDesc(halfScores),
                sortedSum: sortDesc(sumScores),
                sortedDoor: sortDesc(doorScores),
                sortedSeg: sortDesc(segScores),
                sortedWuXing: sortDesc(wuXingScores),
                sortedTailSum: sortDesc(tailSumScores),
                sortedHeadParity: sortDesc(headParityScores),
                killNums: selectedKills.sort((a,b)=>a-b)
            };
        }

        function pickKillWithCooldown(sortedPool, count, recentHistory) {
            let selected = [];
            let pool = sortedPool.slice();
            for (let i = 0; i < pool.length; i++) {
                if (selected.length >= count) break;
                if (!recentHistory.includes(pool[i])) selected.push(pool[i]);
            }
            if (selected.length < count) {
                for (let i = 0; i < pool.length; i++) {
                    if (selected.length >= count) break;
                    if (!selected.includes(pool[i])) selected.push(pool[i]);
                }
            }
            return selected;
        }

        async function startScan() {
            const btn = document.getElementById('btnScan');
            const modal = document.getElementById('calcModal');
            const progressBar = document.getElementById('progressBar');
            const logsContainer = document.getElementById('calcLogs');
            const strategy = document.getElementById('selStrategy').value;
            
            document.getElementById('vipModal').classList.remove('show');
            modal.classList.add('show');
            progressBar.style.width = '0%';
            progressBar.style.background = 'linear-gradient(90deg, var(--blue), var(--red))';
            logsContainer.innerHTML = '';
            btn.disabled = true;

            let strategyName = strategy === 'intersect' ? 'Strict Intersect' : (strategy === 'combo' ? 'Dual Track Combo' : 'Single Miss Track');
            document.getElementById('calcStrategyName').innerText = strategyName;

            const logs = [
                { text: "> [SYS] 建立量子加密隧道...", type: "" },
                { text: "> [SYNC] 拉取最新全量历史开奖数据...", type: "log-sys" },
                { text: "> [DATA] 数据清洗完毕，剔除异常噪点.", type: "log-success" },
                { text: "> [NORM] 执行多因子 Min-Max 标准化...", type: "log-warn" },
                { text: `> [ALGO] 启用剥离策略: ${strategyName}...`, type: "log-warn" },
                { text: "> [COMPUTE] 执行历史回测与12维全属性计算...", type: "log-danger" },
                { text: "> [RISK] 锁定高危雷区(合尾/头单双/五行)...", type: "log-danger" },
                { text: "> [DONE] 模型计算完毕，全维策略矩阵生成.", type: "log-success" }
            ];

            let logIndex = 0;
            const logTimer = setInterval(() => {
                if (logIndex < logs.length) {
                    const p = document.createElement('div');
                    p.className = logs[logIndex].type;
                    p.innerHTML = logs[logIndex].text + (logIndex === logs.length - 1 ? '' : '<span class="cursor"></span>');
                    if (logsContainer.lastChild && logsContainer.lastChild.querySelector('.cursor')) {
                        logsContainer.lastChild.querySelector('.cursor').remove();
                    }
                    logsContainer.appendChild(p);
                    logsContainer.scrollTop = logsContainer.scrollHeight;
                    progressBar.style.width = ((logIndex + 1) / logs.length * 100) + '%';
                    logIndex++;
                } else {
                    clearInterval(logTimer);
                }
            }, 200);

            try {
                const fetchPromise = fetch(DATA_URL + '?t=' + Date.now(), { cache: 'no-store' }).then(res => res.json());
                const [raw, _] = await Promise.all([fetchPromise, new Promise(r => setTimeout(r, 2000))]);

                SEQ = raw.map(x => ({ 
                    period: x.period || x.issue, 
                    num: parseInt(x.num || x.number),
                    date: x.date || x.time || x.openTime || null
                })).filter(x => x.period && x.num > 0);
                
                clearInterval(logTimer);
                progressBar.style.width = '100%';
                progressBar.style.background = 'linear-gradient(90deg, var(--green), var(--blue))';
                
                logsContainer.innerHTML = '';
                const p = document.createElement('div');
                p.className = 'log-success';
                p.innerHTML = "> [SUCCESS] 数据同步与全属性策略运算完成！";
                logsContainer.appendChild(p);
                
                renderLatestResult();
                renderDashboard();

            } catch (e) {
                clearInterval(logTimer);
                progressBar.style.width = '100%';
                progressBar.style.background = 'var(--red)';
                logsContainer.innerHTML = `<div class="log-danger">> [ERR] 数据同步失败: ${e.message}</div>`;
            } finally {
                setTimeout(() => {
                    modal.classList.remove('show');
                    btn.disabled = false;
                }, 500); 
            }
        }

        function renderLatestResult() {
            if (SEQ.length === 0) return;
            const latest = SEQ[SEQ.length - 1];
            document.getElementById('latestPeriod').innerText = `最新开奖：第 ${latest.period} 期`;
            
            let dateStr = "--";
            if (latest.date) dateStr = latest.date.replace('T', ' ').substring(0, 16);
            else {
                const now = new Date();
                dateStr = now.getFullYear() + "-" + (now.getMonth()+1).toString().padStart(2,'0') + "-" + now.getDate().toString().padStart(2,'0') + " " + now.getHours().toString().padStart(2,'0') + ":" + now.getMinutes().toString().padStart(2,'0');
            }
            document.getElementById('latestDate').innerText = dateStr;
            document.getElementById('latestNum').innerText = latest.num < 10 ? '0'+latest.num : latest.num;
            document.getElementById('latestZodiac').innerText = getZodiac(latest.num);
        }

        function renderDashboard() {
            if (SEQ.length === 0) return;

            const testLen = isVIP ? parseInt(document.getElementById('selPeriod').value) : 30;
            const count = isVIP ? parseInt(document.getElementById('selCount').value) : 1;
            const strategy = isVIP ? document.getElementById('selStrategy').value : 'miss';
            
            const start = SEQ.length - testLen;
            
            const nextPeriodNum = parseInt(SEQ[SEQ.length - 1].period.replace(/\D/g, '')) + 1;
            document.getElementById('targetPeriodDisplay').innerText = `目标预测：第 ${nextPeriodNum} 期剥离`;

            const isOddPeriod = nextPeriodNum % 2 !== 0;
            const listWrapper = document.getElementById('killList');
            const overlay = document.getElementById('vipOverlay');

            if (isOddPeriod && !isVIP) {
                listWrapper.classList.add('vip-blur');
                overlay.classList.add('show');
            } else {
                listWrapper.classList.remove('vip-blur');
                overlay.classList.remove('show');
            }

            let stats = {
                kz: { hits: 0, maxWin: 0, curWin: 0 }, kt: { hits: 0, maxWin: 0, curWin: 0 }, khead: { hits: 0, maxWin: 0, curWin: 0 }, 
                khalf: { hits: 0, maxWin: 0, curWin: 0 }, ksum: { hits: 0, maxWin: 0, curWin: 0 }, kdoor: { hits: 0, maxWin: 0, curWin: 0 }, 
                kseg: { hits: 0, maxWin: 0, curWin: 0 }, kwuxing: { hits: 0, maxWin: 0, curWin: 0 }, ktailsum: { hits: 0, maxWin: 0, curWin: 0 }, 
                kheadparity: { hits: 0, maxWin: 0, curWin: 0 }, kn5: { hits: 0, maxWin: 0, curWin: 0 }, kn10: { hits: 0, maxWin: 0, curWin: 0 }
            };

            let histKZ = [], histKT = [], histKHead = [], histKHalf = [], histKSum = [], histKDoor = [], histKSeg = [], 
                histKWuXing = [], histKTailSum = [], histKHeadParity = [], histKN5 = [], histKN10 = [];

            for (let i = start; i < SEQ.length; i++) {
                const past = SEQ.slice(0, i).map(x => x.num);
                const real = SEQ[i].num;
                
                let pools = calcScores(past, strategy, count, [], true);
                
                const kZ = pickKillWithCooldown(pools.sortedZ, count, histKZ);
                histKZ = histKZ.concat(kZ).slice(-COOLDOWN_ZODIAC);

                const kT = pickKillWithCooldown(pools.sortedT, count, histKT);
                histKT = histKT.concat(kT).slice(-COOLDOWN_ZODIAC);

                const kHeadRaw = pickKillWithCooldown(pools.sortedHead, count, histKHead);
                const kHead = kHeadRaw.map(h => h + "头");
                histKHead = histKHead.concat(kHeadRaw).slice(-COOLDOWN_ZODIAC);

                const kHalf = pickKillWithCooldown(pools.sortedHalf, count, histKHalf);
                histKHalf = histKHalf.concat(kHalf).slice(-COOLDOWN_ZODIAC);

                const kSum = pickKillWithCooldown(pools.sortedSum, count, histKSum);
                histKSum = histKSum.concat(kSum).slice(-COOLDOWN_ZODIAC);

                const kDoor = pickKillWithCooldown(pools.sortedDoor, count, histKDoor);
                histKDoor = histKDoor.concat(kDoor).slice(-COOLDOWN_ZODIAC);

                const kSeg = pickKillWithCooldown(pools.sortedSeg, count, histKSeg);
                histKSeg = histKSeg.concat(kSeg).slice(-COOLDOWN_ZODIAC);

                const kWuXing = pickKillWithCooldown(pools.sortedWuXing, count, histKWuXing);
                histKWuXing = histKWuXing.concat(kWuXing).slice(-COOLDOWN_ZODIAC);

                const kTailSum = pickKillWithCooldown(pools.sortedTailSum, count, histKTailSum);
                histKTailSum = histKTailSum.concat(kTailSum).slice(-COOLDOWN_ZODIAC);

                const kHeadParity = pickKillWithCooldown(pools.sortedHeadParity, count, histKHeadParity);
                histKHeadParity = histKHeadParity.concat(kHeadParity).slice(-COOLDOWN_ZODIAC);

                const pools5 = calcScores(past, strategy, 5, histKN5, true);
                const kNums5 = pools5.killNums;
                histKN5 = histKN5.concat(kNums5).slice(-COOLDOWN_NUM);

                const pools10 = calcScores(past, strategy, 10, histKN10, true);
                const kNums10 = pools10.killNums;
                histKN10 = histKN10.concat(kNums10).slice(-COOLDOWN_NUM);

                const realZ = getZodiac(real);
                const realT = real % 10;
                const realHead = getHead(real);
                const realHalf = getHalfWave(real);
                const realSum = getSumGroupReal(real);
                const realDoor = getDoorGroup(real);
                const realSeg = getSegGroup(real);
                const realWuXing = getWuXing(real);
                const realTailSum = getTailSum(real);
                const realHeadParity = getHeadParity(real);

                const updateStat = (key, isHit) => {
                    if(isHit) {
                        stats[key].hits++;
                        stats[key].curWin++;
                        if(stats[key].curWin > stats[key].maxWin) stats[key].maxWin = stats[key].curWin;
                    } else {
                        stats[key].curWin = 0;
                    }
                };
                
                updateStat('kz', (!kZ.includes(realZ)));
                updateStat('kt', (!kT.includes(realT)));
                updateStat('khead', (!kHead.includes(realHead)));
                updateStat('khalf', (!kHalf.includes(realHalf)));
                updateStat('ksum', (!kSum.includes(realSum)));
                updateStat('kdoor', (!kDoor.includes(realDoor)));
                updateStat('kseg', (!kSeg.includes(realSeg)));
                updateStat('kwuxing', (!kWuXing.includes(realWuXing)));
                updateStat('ktailsum', (!kTailSum.includes(realTailSum)));
                updateStat('kheadparity', (!kHeadParity.includes(realHeadParity)));
                updateStat('kn5', (!kNums5.includes(real)));
                updateStat('kn10', (!kNums10.includes(real)));
            }

            const currentPast = SEQ.map(x => x.num);
            const nextPools = calcScores(currentPast, strategy, count, [], false);
            
            const nextKZ = pickKillWithCooldown(nextPools.sortedZ, count, histKZ);
            const nextKT = pickKillWithCooldown(nextPools.sortedT, count, histKT);
            const nextKHeadRaw = pickKillWithCooldown(nextPools.sortedHead, count, histKHead);
            const nextKHead = nextKHeadRaw.map(h => h + "头");
            const nextKHalf = pickKillWithCooldown(nextPools.sortedHalf, count, histKHalf);
            
            const nextKSum = pickKillWithCooldown(nextPools.sortedSum, count, histKSum);
            const nextKDoor = pickKillWithCooldown(nextPools.sortedDoor, count, histKDoor);
            const nextKSeg = pickKillWithCooldown(nextPools.sortedSeg, count, histKSeg);
            const nextKWuXing = pickKillWithCooldown(nextPools.sortedWuXing, count, histKWuXing);
            const nextKTailSum = pickKillWithCooldown(nextPools.sortedTailSum, count, histKTailSum);
            const nextKHeadParity = pickKillWithCooldown(nextPools.sortedHeadParity, count, histKHeadParity);

            const nextKN5 = calcScores(currentPast, strategy, 5, histKN5, false).killNums;
            const nextKN10 = calcScores(currentPast, strategy, 10, histKN10, false).killNums;

            const getRate = (hits) => ((hits / testLen) * 100).toFixed(1);

            const renderItem = (title, valArray, hits, maxWin, isFixed5, isFixed10, isIntersect) => {
                const rate = getRate(hits);
                const valStr = valArray.join(', ');
                let countLabel = `杀${count}个`;
                if(isFixed5) countLabel = "杀5码";
                if(isFixed10) countLabel = "杀10码";
                
                let rateColor = rate >= 90 ? 'var(--green)' : (rate >= 80 ? 'var(--gold)' : 'var(--red)');
                let badge = (isIntersect && strategy === 'intersect') ? '<span class="intersect-badge">🔒 三轨交集</span>' : '';
                
                return `
                <div class="kill-item">
                    <div class="kill-info">
                        <div class="kill-title">${title} (下期剔除: ${countLabel}) ${badge}</div>
                        <div class="kill-stat">
                            <span>胜率: <span class="stat-rate" style="color:${rateColor}">${rate}%</span></span>
                            <span>命中: <span class="stat-hit">${hits}/${testLen}</span></span>
                            <span>最高连中: <span class="stat-hit">${maxWin}期</span></span>
                        </div>
                    </div>
                    <div class="kill-value">${valStr}</div>
                </div>
                `;
            };

            const html = `
                ${renderItem("高危生肖剥离", nextKZ, stats.kz.hits, stats.kz.maxWin, false, false, false)}
                ${renderItem("高危头数剥离", nextKHead, stats.khead.hits, stats.khead.maxWin, false, false, false)}
                ${renderItem("冷门尾数剥离", nextKT.map(t=>t+"尾"), stats.kt.hits, stats.kt.maxWin, false, false, false)}
                ${renderItem("变异半波剥离", nextKHalf, stats.khalf.hits, stats.khalf.maxWin, false, false, false)}
                ${renderItem("高危合数剥离", nextKSum, stats.ksum.hits, stats.ksum.maxWin, false, false, false)}
                ${renderItem("高危门数剥离", nextKDoor, stats.kdoor.hits, stats.kdoor.maxWin, false, false, false)}
                ${renderItem("高危段位剥离", nextKSeg, stats.kseg.hits, stats.kseg.maxWin, false, false, false)}
                ${renderItem("高危合尾剥离", nextKTailSum, stats.ktailsum.hits, stats.ktailsum.maxWin, false, false, false)}
                ${renderItem("头数单双剥离", nextKHeadParity, stats.kheadparity.hits, stats.kheadparity.maxWin, false, false, false)}
                ${renderItem("五行剥离", nextKWuXing, stats.kwuxing.hits, stats.kwuxing.maxWin, false, false, false)}
                ${renderItem("精准号码剥离", nextKN5, stats.kn5.hits, stats.kn5.maxWin, true, false, true)}
                ${renderItem("重火力覆盖", nextKN10, stats.kn10.hits, stats.kn10.maxWin, false, true, true)}
            `;

            document.getElementById('killList').innerHTML = html;
        }

        window.onload = () => {
            initVIPUI();
            fetch(DATA_URL + '?t=' + Date.now(), { cache: 'no-store' })
                .then(res => res.json())
                .then(raw => {
                    SEQ = raw.map(x => ({ 
                        period: x.period || x.issue, 
                        num: parseInt(x.num || x.number),
                        date: x.date || x.time || x.openTime || null
                    })).filter(x => x.period && x.num > 0);
                    renderLatestResult();
                    renderDashboard();
                })
                .catch(e => console.error("首次数据加载失败", e));
        };
    </script>
</body>
</html>
